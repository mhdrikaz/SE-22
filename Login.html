<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Car Rental Login | DriveAway</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Login.css" />
  </head>
  <body class="position-relative">
    <div class="page-wrap d-flex align-items-center justify-content-center position-relative">
      <div class="bg-image-wrap">
        <img
          alt="City Street"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDY0frfS7Bl8aAkfT0ny3kndP8Ylyzm5x9WqZtW9lZz6eAKzLqQxukW6TriVydT-aCfewUt-4gdjzMg1Q8sN77lVj6-bUoeScXFk1NTWjmZ4dIbF2dLypoDd_4heusrcLOKStVC1hUrVJSOJw-IeGCvTCxZ4624Ju7iL4FFflCR1XQbyUifSWuZnr7NtAhpt-ZRfozne5BO41XgfJHeFeK_Cm2_CmRwyu8b57V_O4q7epe0hHfcWRRjFu_XaWWF9MkXNhs1ME5QreSh"
        />
        <div class="bg-overlay"></div>
      </div>
      <main class="main-content">
        <div class="d-flex flex-column align-items-center mb-4 mb-md-5">
          <div class="brand-icon">
            <span class="material-icons">directions_car</span>
          </div>
          <h1 class="brand-title">DriveAway</h1>
          <p class="brand-subtitle">Your journey begins here</p>
        </div>
        <div class="login-card">
          <div class="mb-4 mb-md-5">
            <h2 class="welcome-title">Welcome Back</h2>
            <p class="welcome-subtitle">Please enter your details to sign in.</p>
          </div>
          <form action="" class="d-flex flex-column gap-4" method="POST">
            <div>
              <label class="form-label-custom" for="email">Email or Username</label>
              <div class="input-wrap">
                <span class="material-icons input-icon">mail_outline</span>
                <input
                  class="form-control-custom"
                  id="email"
                  name="email"
                  placeholder="name@example.com"
                  required=""
                  type="email"
                />
              </div>
            </div>
            <div>
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label-custom mb-0" for="password">Password</label>
                <a class="link-primary-custom small" href="#">Forgot password?</a>
              </div>
              <div class="input-wrap">
                <span class="material-icons input-icon">lock_outline</span>
                <input
                  class="form-control-custom password-field"
                  id="password"
                  name="password"
                  placeholder="********"
                  required=""
                  type="password"
                />
                <button class="icon-btn" type="button">
                  <span class="material-icons" style="font-size: 20px">visibility_off</span>
                </button>
              </div>
            </div>
            <div class="d-flex align-items-center">
              <input
                class="form-check-input m-0"
                id="remember"
                name="remember"
                type="checkbox"
              />
              <label class="remember-label ms-2" for="remember">Remember this device</label>
            </div>
            <button class="btn-signin" type="submit">
              Sign In
            </button>
          </form>
          <div class="mt-4 mt-md-5 text-center">
            <p class="welcome-subtitle mb-0">
              New to DriveAway?
              <a class="link-primary-custom fw-semibold" href="Reg.html">Create an account</a>
            </p>
          </div>
        </div>
        <footer class="footer-links mt-4 mt-md-5 d-flex justify-content-center gap-4">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="#">Help Center</a>
        </footer>
      </main>
    </div>
    <div class="support-wrap">
      <button class="support-btn">
        <span class="material-icons">support_agent</span>
      </button>
    </div>
  </body>
</html>
